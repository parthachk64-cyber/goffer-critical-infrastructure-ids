name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests data
      - name: Fixture checksums
        run: python data/generate_fixture.py --check
      - name: Tests with coverage gate
        run: python -m pytest --cov=infra_ids --cov-report=term-missing --cov-fail-under=80
      - name: Demo smoke run
        run: |
          python -m infra_ids demo --seed 42 --out runs/demo
          python -m infra_ids report --run runs/demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-run-${{ matrix.python-version }}
          path: runs/demo
